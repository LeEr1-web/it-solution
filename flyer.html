<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flyers à imprimer — IloTech</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    :root{--bleu:#1673e6;--encre:#0b1526;--gris:#55617a;--orange:#f59e0b}
    *{box-sizing:border-box}
    body{margin:0;background:#e9edf3;font:14px/1.35 "Segoe UI",system-ui,Arial,sans-serif;color:var(--encre)}
    .barre{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:#000;color:#fff}
    .barre b{margin-right:auto;font-size:16px}
    .barre button,.barre a{min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid #31425f;background:#0e1628;color:#fff;font:600 14px inherit;text-decoration:none;cursor:pointer}
    .barre button.on{background:var(--bleu);border-color:var(--bleu)}
    .barre .imp{background:var(--orange);border-color:var(--orange);color:#1a1000}
    .aide{max-width:210mm;margin:10px auto;color:var(--gris);padding:0 8px}
    .feuille{width:210mm;height:297mm;margin:0 auto 20px;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;box-shadow:0 4px 20px rgba(0,0,0,.15)}
    .fly{position:relative;padding:7mm 7mm 6mm;border:0 dashed #c8cfda;display:flex;flex-direction:column;gap:2.2mm;overflow:hidden}
    .fly:nth-child(odd){border-right-width:1px}.fly:nth-child(-n+2){border-bottom-width:1px}
    .fly::before{content:"";position:absolute;inset:0 0 auto 0;height:3.2mm;background:linear-gradient(90deg,#1673e6,#22d3ee,#f59e0b)}
    .tete{display:flex;align-items:center;gap:3mm;margin-top:1.5mm}
    .tete img{height:13mm;border-radius:2mm}
    .tete b{display:block;font-size:17pt;letter-spacing:.3px}.tete b span{color:var(--bleu)}
    .tete small{display:block;font-size:8pt;color:var(--gris)}
    h2{margin:1.5mm 0 1mm;font-size:15.5pt;line-height:1.15}
    ul{margin:0;padding:0;list-style:none;display:grid;gap:2.2mm;font-size:11pt}
    li{display:flex;justify-content:space-between;gap:2mm;border-bottom:.2mm dotted #c8cfda;padding-bottom:.8mm}
    li b{white-space:nowrap;color:var(--bleu)}
    .plus{margin:1.5mm 0 0;font-size:9.8pt;font-weight:700;color:#157347;line-height:1.5}
    .bas{margin-top:auto;display:flex;gap:3mm;align-items:flex-end}
    .tels{flex:1;font-size:9pt}
    .tels b{display:block;font-size:13.5pt}
    .tels small{color:var(--gris)}
    .qr{display:grid;justify-items:center;gap:.8mm;font-size:7pt;font-weight:700;text-align:center}
    .qr div{width:26mm;height:26mm}
    .qr img,.qr canvas{width:26mm!important;height:26mm!important}
    @media print{
      @page{size:A4;margin:0}
      body{background:#fff}.barre,.aide{display:none}
      .feuille{margin:0;box-shadow:none;page-break-after:always}
      .fly::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
    @media screen and (max-width:820px){.feuille{zoom:.45}}
    body.solo{background:#fff}
    body.solo .barre,body.solo .aide{display:none}
    body.solo .feuille{width:105mm;height:148mm;margin:0;box-shadow:none;display:block;zoom:var(--zoom,1)}
    body.solo .fly{height:148mm;border:0!important}
  </style>
</head>
<body>
  <div class="barre">
    <b>Flyers IloTech</b>
    <button type="button" id="bPart" onclick="choisir('part')">Particuliers</button>
    <button type="button" id="bPro" onclick="choisir('pro')">Professionnels</button>
    <button type="button" class="imp" onclick="print()">Imprimer (4 par page A4)</button>
    <a href="visibilite.html">Retour</a>
  </div>
  <p class="aide">Imprimez sur du papier un peu épais (160 g ou plus), puis découpez le long des pointillés. En boîte aux lettres, respectez les « Stop pub ». Les prix sont repris du site et restent toujours à jour.</p>
  <div class="feuille" id="feuille"></div>
  <script src="data.js?v=66"></script>
  <script src="outils.js?v=66"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const s = svc, p = pack;
    const dès = id => `dès ${eur(s(id).base)}${s(id).mensuel ? '/mois' : ''}`;
    const VERSIONS = {
      part: { titre: 'Un souci avec votre ordinateur, votre Wi-Fi ou votre téléphone ?', lignes: [
          ['PC lent, en panne, virus', dès('repair')], ['Photos et fichiers perdus', dès('recup')],
          [`Wi-Fi dans toute la maison`, eur(p('wifi').prix)], ['Caméras de surveillance', dès('camera')],
          ['Installation PC et imprimante', dès('install')], ['Cours débutants et seniors', dès('cours')]],
        plus: `Devis gratuit · Prix annoncé avant · −${CONFIG.remiseEtudiant} % étudiants`, qr: 'Rendez-vous en ligne' },
      pro: { titre: 'Commerces, cabinets, entreprises : une informatique qui marche.', lignes: [
          ['Caisse enregistreuse complète', `${eur(p('shop').prix)}`], ['Caméras et alarme', dès('camera')],
          ['Site internet + Google', dès('siteweb')], ['Maintenance du parc', dès('maintenance')],
          ['Sauvegardes automatiques', dès('sauvegarde')], ['Contrôle sécurité express', dès('cyberexpress')]],
        plus: 'Devis gratuit · Intervention rapide · Prix fixés à l’avance', qr: 'Devis et rendez-vous' }
    };
    const q = new URLSearchParams(location.search);
    let version = q.get('v') === 'pro' ? 'pro' : 'part';
    const sansPrix = q.get('prix') === '0', solo = q.get('solo') === '1';
    if (solo) { document.body.classList.add('solo'); if (q.get('zoom')) document.body.style.setProperty('--zoom', q.get('zoom')); }
    // sans prix (flyer joint aux emails de prospection) : une coche à la place du prix
    if (sansPrix) Object.values(VERSIONS).forEach(v => { v.lignes = v.lignes.map(([a]) => [a, '✓']); v.plus = v.plus.replace(' · Prix fixés à l’avance', ' · Prix annoncé avant'); });
    function flyer(v) {
      return `<div class="fly">
        <div class="tete"><img src="img/logo-ilo.png" alt=""><div><b>Ilo<span>Tech</span></b><small>Dépannage &amp; installation informatique · Martinique</small></div></div>
        <h2>${v.titre}</h2>
        <ul>${v.lignes.map(([a, b]) => `<li><span>${a}</span><b>${b}</b></li>`).join('')}</ul>
        <p class="plus">✓ ${v.plus}<br>✓ Chez vous, en agence ou à distance</p>
        <div class="bas"><div class="tels">${Object.values(AGENCES).map(a => `<b>${a.tel}</b><small>Agence ${a.nom} · appel ou WhatsApp</small>`).join('')}</div>
          <div class="qr"><div class="code"></div>${v.qr}</div></div></div>`;
    }
    function choisir(v) {
      version = v;
      document.getElementById('bPart').classList.toggle('on', v === 'part');
      document.getElementById('bPro').classList.toggle('on', v === 'pro');
      document.getElementById('feuille').innerHTML = flyer(VERSIONS[v]).repeat(solo ? 1 : 4);
      document.querySelectorAll('.code').forEach(el => {
        if (window.QRCode) new QRCode(el, { text: SITE + (v === 'pro' ? 'services.html?src=' + (q.get('src') || 'flyer-pro') : '?src=' + (q.get('src') || 'flyer')), width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
        else el.textContent = SITE;
      });
    }
    choisir(version);
  </script>
</body>
</html>
