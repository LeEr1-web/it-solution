<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IloTech — Plaquette de présentation</title>
  <meta name="description" content="IloTech, entreprise informatique en Martinique (Ducos et Le Robert) : informatique, maison connectée, web et marketing, solutions pour les entreprises, drone et impression 3D.">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    :root{--bleu:#1673e6;--encre:#0b1526;--gris:#55617a;--trait:#dde3ec}
    *{box-sizing:border-box}
    body{margin:0;background:#e9edf3;color:var(--encre);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
    .barre{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#000;color:#fff}
    .barre b{margin-right:auto}
    .barre a,.barre button{min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid #31425f;background:#0e1628;color:#fff;font:600 14px inherit;text-decoration:none;cursor:pointer}
    .barre .imp{background:#f59e0b;border-color:#f59e0b;color:#1a1000}
    .page{max-width:1000px;margin:18px auto 40px;background:#fff;border-radius:14px;box-shadow:0 6px 30px rgba(11,21,38,.12);overflow:hidden}
    .couv{display:flex;align-items:center;gap:22px;padding:34px 40px;background:radial-gradient(700px 300px at 0 0,rgba(43,140,255,.35),transparent 60%),#000;color:#fff}
    .couv img{height:84px}
    .couv h1{margin:0;font-size:34px;letter-spacing:.3px}.couv h1 span{color:#2b8cff}
    .couv p{margin:6px 0 0;color:#c9d5e6;font-size:16px}
    .couv .tag{display:inline-block;margin-top:10px;padding:3px 10px;border:1px solid #f59e0b;border-radius:6px;color:#f59e0b;font:700 12px ui-monospace,Consolas,monospace;letter-spacing:.5px}
    section{padding:26px 40px;border-bottom:1px solid var(--trait)}
    h2{margin:0 0 12px;font-size:22px}
    .intro{font-size:16.5px;max-width:820px}
    .poles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .pole{display:flex;gap:14px;padding:14px;border:1px solid var(--trait);border-left:5px solid var(--t);border-radius:12px;break-inside:avoid}
    .pole .illu{flex:none;width:108px;height:74px;border-radius:10px}
    .pole>div{min-width:0}
    .pole b{display:block;font-size:17px}
    .pole p{margin:2px 0 6px;color:var(--gris);font-size:14px}
    .pole ul{margin:0;padding-left:18px;font-size:13.5px}
    .pole li{margin:1px 0}
    .pole li small{color:var(--gris)}
    .atouts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .atout{padding:14px;border-radius:12px;background:#f5f7fb}
    .atout b{display:block;margin-bottom:2px}
    .atout span{color:var(--gris);font-size:14px}
    .etapes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:e}
    .etape{position:relative;padding:14px 14px 14px 52px;border:1px solid var(--trait);border-radius:12px}
    .etape::before{counter-increment:e;content:counter(e);position:absolute;left:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--bleu);color:#fff;font-weight:800;display:grid;place-items:center}
    .etape b{display:block}.etape span{color:var(--gris);font-size:14px}
    .contact{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:center}
    .agence{padding:14px;border-radius:12px;background:#f5f7fb}
    .agence b{display:block;font-size:17px}
    .agence .tel{font:700 20px ui-monospace,Consolas,monospace;color:var(--bleu)}
    .qr{text-align:center;font-size:12px;font-weight:700;color:var(--gris)}
    .qr div{width:120px;height:120px;margin:0 auto 4px}
    .qr img,.qr canvas{width:120px!important;height:120px!important}
    footer{padding:14px 40px;font-size:12px;color:var(--gris);text-align:center}
    @media (max-width:760px){.couv,section{padding:22px 18px}.couv{flex-direction:column;text-align:center}.atouts,.etapes,.contact{grid-template-columns:1fr}.pole{flex-direction:column}.pole .illu{width:100%;height:auto}.page{margin:0;border-radius:0}}
    @media print{
      @page{size:A4;margin:10mm}
      body{background:#fff}.barre{display:none}.page{margin:0;box-shadow:none;border-radius:0;max-width:none}
      .couv,.pole,.atout,.agence,.etape::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      section{padding:16px 6px}.poles{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>
  <div class="barre"><b>Plaquette IloTech</b><button type="button" class="imp" onclick="print()">Imprimer / PDF</button><a href="index.html">Prendre rendez-vous</a></div>
  <article class="page" id="plaquette"></article>
  <script src="data.js?v=63"></script>
  <script src="outils.js?v=63"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (function () {
      const poles = UNIVERS.map(u => ({ ...u, cats: CATEGORIES.filter(c => c.univers === u.id && !c.bientot) }));
      const atouts = [
        ['Une équipe locale', 'Deux agences, à Ducos et au Robert, et des déplacements dans toute la Martinique.'],
        ['Devis gratuit', 'Nous étudions votre besoin et vous remettons un devis gratuit, sans engagement.'],
        ['Prix annoncé à l’avance', 'Vous validez une proposition claire avant toute intervention.'],
        ['Un seul interlocuteur', 'Du dépannage au site internet : un contact qui connaît votre installation.'],
        ['Réactivité', 'Intervention rapide, en agence, chez vous ou à distance selon le besoin.'],
        ['Discrétion et sécurité', 'Vos données et vos accès sont traités avec soin et confidentialité.']
      ];
      const etapes = [['On échange', 'Vous nous expliquez votre besoin, par téléphone, WhatsApp ou en ligne.'], ['Devis gratuit', 'Nous regardons la situation, sur place ou à distance, et chiffrons la solution.'],
        ['Proposition claire', 'Une solution et un prix annoncés avant de commencer.'], ['Intervention et suivi', 'Nous réalisons, expliquons et restons disponibles ensuite.']];
      $('plaquette').innerHTML = `
        <header class="couv"><img src="img/logo-ilo.png" alt="IloTech"><div><h1>Ilo<span>Tech</span></h1>
          <p>Informatique, réseaux, web et sécurité — Martinique</p><span class="tag">DUCOS · LE ROBERT</span></div></header>
        <section><h2>Qui sommes-nous ?</h2><p class="intro">IloTech accompagne les particuliers, les commerces et les entreprises de Martinique dans tout ce qui touche au numérique : dépannage et installation, réseaux et Wi-Fi, maison connectée, sites web, applications et marketing, maintenance et cybersécurité, jusqu’aux images aériennes par drone et à l’impression 3D. Notre engagement : des solutions fiables, expliquées simplement.</p></section>
        <section><h2>Nos pôles</h2><div class="poles">${poles.map(u => `<div class="pole" style="--t:${u.couleur}">${illustration(u)}<div><b>${esc(u.nom)}</b><p>${esc(u.desc)}</p><ul>${u.cats.map(c => `<li><b style="display:inline;font-size:13.5px">${esc(c.nom)}</b> <small>— ${esc(c.services.map(id => svc(id).nom).join(', '))}</small></li>`).join('')}</ul></div></div>`).join('')}</div></section>
        <section><h2>Pourquoi IloTech ?</h2><div class="atouts">${atouts.map(([t, d]) => `<div class="atout"><b>${t}</b><span>${d}</span></div>`).join('')}</div></section>
        <section><h2>Comment ça se passe ?</h2><div class="etapes">${etapes.map(([t, d]) => `<div class="etape"><b>${t}</b><span>${d}</span></div>`).join('')}</div></section>
        <section><h2>Nous contacter</h2><div class="contact">${Object.values(AGENCES).map(a => `<div class="agence"><b>Agence ${esc(a.de)}</b><span class="tel">${esc(a.tel)}</span><br><span>Appel ou WhatsApp · ${esc(a.detail)}</span></div>`).join('')}
          <div class="qr"><div id="qr"></div>Rendez-vous en ligne</div></div>
          <p>${CONFIG.email ? `Email : <b>${esc(CONFIG.email)}</b> · ` : ''}Site : <b>${esc(SITE.replace(/^https:\/\//, ''))}</b></p></section>
        <footer>${esc(ENTREPRISE.nomCommercial)} — Entreprise individuelle · SIRET ${esc(ENTREPRISE.siret)} · ${esc(ENTREPRISE.adresse)}</footer>`;
      if (window.QRCode) new QRCode($('qr'), { text: SITE + '?src=plaquette', width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
    })();
  </script>
</body>
</html>
